# EXAMPLE ONLY - not referenced by kustomization.yaml.
# Shows how the api would obtain secrets from AWS Secrets Manager using External Secrets Operator.
# Git contains only the reference (key names), never the value.
# Requires: External Secrets Operator installed, and a ClusterSecretStore named "aws-secrets-manager"
# that authenticates through IRSA / EKS Pod Identity (no static AWS keys).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: api-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: api-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: aeon/<env>/api/database   # placeholder path, <env> = dev or prod
        property: url
