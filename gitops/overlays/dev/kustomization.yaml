apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: api-dev
resources:
  - ../../base
labels:
  - pairs:
      environment: dev
    includeSelectors: false
# CI updates this block (kustomize edit set image) with the immutable Git SHA tag.
images:
  - name: registry.example.com/aeon/api
    newTag: "0000000"            # PLACEHOLDER, replaced by Jenkins on every successful build
patches:
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: APP_ENV
          value: dev
